<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e9">
  <meta name="description" content="有一封信，想交给你。">
  <title>有一封信，想交给你</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span>♡</span><span>♡</span><span>♡</span></div>
  <header class="masthead"><span class="brand-heart" aria-hidden="true">♡</span><span>一封心里的信</span><button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" aria-label="播放背景音乐"><span aria-hidden="true">♪</span> <span id="music-label">播放音乐</span></button></header>
  <main>
    <section id="entry" class="stage entry" aria-labelledby="entry-title">
      <div class="small-envelope" aria-hidden="true"><span>♥</span></div>
      <h1 id="entry-title">有一封信，<br>想交给<span class="accent">你。</span></h1>
      <form id="name-form" novalidate autocomplete="off">
        <label for="name">该怎么称呼你？</label>
        <input id="name" name="name" placeholder="写下你的名字或昵称" aria-describedby="name-error" required>
        <p id="name-error" class="error" role="alert"></p>
        <button class="primary" type="submit">收下这封信 <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <section id="envelope-stage" class="stage envelope-stage" hidden aria-labelledby="envelope-title">
      <h1 id="envelope-title" tabindex="-1">这封信，<br>是写给你的。</h1>
      <button id="envelope" class="envelope" type="button" aria-label="轻轻打开信封">
        <span class="envelope-letter" aria-hidden="true">有些话，想告诉你。</span>
        <span class="envelope-front" aria-hidden="true"></span>
        <span class="envelope-flap" aria-hidden="true"></span>
        <span class="recipient">致：<span id="recipient-name"></span></span>
        <span class="seal" aria-hidden="true">♥</span>
      </button>
      <button id="open-letter" class="primary" type="button">轻轻打开 <span aria-hidden="true">♡</span></button>
    </section>
    <section id="letter-stage" class="stage letter-stage" hidden aria-labelledby="letter-title">
      <article class="paper">
        <div class="paper-heading"><span>FOR YOU</span><span aria-hidden="true">♡</span></div>
        <h1 id="letter-title" tabindex="-1"><span id="letter-name"></span>：</h1>
        <div id="letter-body"></div>
        <div class="paper-ending" aria-hidden="true">♡</div>
      </article>
      <div class="choices" aria-label="你的回应">
        <button id="accept" class="primary" type="button">我愿意 <span aria-hidden="true">♡</span></button>
        <button id="consider" class="secondary" type="button">我想再想想</button>
      </div>
      <div id="response" class="response" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </section>
    <noscript><p class="noscript">请开启浏览器的 JavaScript，让这封信为你展开。</p></noscript>
  </main>
  <div id="celebration" aria-hidden="true"></div>
</body>
</html>
